[package]
name = "alps-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ALPS — Dioxus 0.7 UI for the ALPS orchestrator"

[[bin]]
name = "alps-ui"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true }
alps-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
gloo-storage = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Direct deps on the `dioxus-fullstack-*` + `dioxus-server` crates so
# `src/api/{tasks,run}.rs` can use the `#[server]` proc-macro and
# `ServerFnError` type under either the `server` or `fullstack`
# feature. The macro's generated code references both `dioxus_fullstack::*`
# AND `dioxus_server::*` paths; Rust doesn't expose indirect deps for
# `use` statements, so we name them explicitly. The proc-macro itself
# is zero-cost type-level annotation; the runtime deps contribute only
# when the relevant feature is enabled.
dioxus-fullstack-macro = { workspace = true }
dioxus-fullstack-core = { workspace = true }
dioxus-fullstack = { workspace = true }
dioxus-server = { workspace = true }

[dev-dependencies]
dioxus-ssr = "0.7"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]
fullstack = ["dioxus/fullstack"]
